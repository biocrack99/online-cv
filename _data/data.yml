career-profile:
  title: Career Profile
  summary: |
    I’m a biomedical engineer with a PhD in visual optics and a passion for advancing technology in optics and ophthalmology. 
    Over the past years, I’ve built a multidisciplinary profile that blends optical design, technical support for ophthalmic equipment, 
    and hands-on experience in optical laboratories. I’ve also contributed to R&D projects in the biotechnology sector and developed 
    projection systems for 3D printing applications. My work is driven by the goal of creating precise, reliable, 
    and innovative solutions that support vision science, eye care technologies, using optics and lighting design. 
education:
  title: Education
  info:
  - degree: PhD in Visual Optics 
    university: National University of Tucuman
    time: 2009 - 2018
    details: |
      In March 2018 I finished my PhD studies on topics related to peripheral aberrations and intraocular scattering  in human vision. The work consisted in designing and evaluating an off-axis scatter parameter that would be robust against normal periphery aberrations in healthy subjects. I also tried different autofocus techniques to decide which double pass image is optimal for optical quality measurements. During this stage I was able to acquire knowledge about visual and physiological optics with some basis in psychophysical methods. Also I obtained researcher skills such as paper writing, scientific dissemination and a critical point of view. This has given me a range of practical capabilities that will meet the needs of this role.
  - degree: Msc in Visual Environment and Efficiente Lighting
    university: National University of Tucuman
    time: 2010 - 2010
    details: |
      Comprehensive training in the design, integration, and evaluation of indoor and outdoor lighting systems, with a focus on both technical and human-centered approaches. The program covers 3D simulations, field measurements, and the use of light measurement instruments to assess both objective and subjective performance. Emphasizes the visual and non-visual effects of lighting based on Human-Centric Lighting principles. Prepares professionals for roles in industry, product development, quality control, and education, while also serving as a foundation for further postgraduate studies.
  - degree: Biomedical Engineer
    university: National University of Tucuman
    time: 2003 - 2009
    details: |
experiences:
  title: Experiences
  info:
  - role: Optical Department Leader
    time: 2024 - Present
    company: Stamm Biotech, Buenos Aires
    details: |
      Currently, I lead the optics department at a biotechnology startup, where we design, develop, and integrate optical systems for innovative biomedical applications and 3d printers. My role includes managing the optics laboratory and maintaining its infrastructure, coordinating multidisciplinary teams, and defining technical strategies aligned with product and regulatory requirements. I also develop and track performance metrics to assess team effectiveness and project outcomes, fostering continuous improvement and operational excellence throughout all stages of development—from concept to prototype and beyond.
  - role: Optics Engineer
    time: 2022 - 2024
    company: Stamm Biotech, Buenos Aires
    details: |
      In this position, the main activities included the design, assembly, integration, and evaluation of UV projection systems, Raman spectroscopy setups, and fluorescent detection systems.
  - role: Posdoc Researcher
    time: 2018 - 2021
    company: ILAV-CONICET, Tucumán 
    details: |
      Conducted a study on visual attention using two psychophysical tasks programmed in Psychtoolbox: the attentional window task and multiple object tracking (MOT). Eye-tracking was performed with a Cambridge Research Systems device and analyzed using MATLAB. The experiment aimed to explore transfer and modulation effects in attentional focus. Data analysis was carried out in R and Python.
  - role: Technical Coordinator 
    time: 2013 - 2014
    company: NIPRO Medical, Buenos Aires 
    details: |
      Coordinated technical service operations, organizing maintenance and repair visits to dialysis centers, primarily for hemodialysis equipment. Also provided technical support during the sales process, assisting with product demonstrations and client consultations.
